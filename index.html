
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aybüke ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: Georgia, serif;
  background:
    linear-gradient(#0005,#0005),
    url("https://hizliresim.com/nxbhvyzm")
    center/cover no-repeat;
}

.envelope {
  width: 290px;
  height: 190px;
  background: #ff9ebd;
  position: relative;
  border-radius: 12px;
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: 0 10px 35px #0006;
  cursor: pointer;
  transition: .8s;
}

.envelope:before {
  content: "";
  position: absolute;
  top: 0;
  border-left: 145px solid transparent;
  border-right: 145px solid transparent;
  border-top: 110px solid #ff75a5;
  transform-origin: top;
  transition: .7s;
  z-index: 3;
}

.envelope span {
  font-size: 27px;
  color: white;
  font-weight: bold;
  z-index: 4;
  text-shadow: 1px 2px 5px #b34c72;
}

.heart {
  position: absolute;
  color: white;
  font-size: 24px;
}

.h1 { left: 15px; bottom: 15px; }
.h2 { right: 15px; bottom: 15px; }

.open:before {
  transform: rotateX(180deg);
}

.open {
  opacity: 0;
  transform: scale(1.5);
  pointer-events: none;
}

.message {
  position: absolute;
  text-align: center;
  color: white;
  opacity: 0;
  transform: scale(.5);
  transition: 1s;
  text-shadow: 0 2px 10px #000;
}

.show {
  opacity: 1;
  transform: scale(1);
}

.date {
  font-size: 35px;
  margin-bottom: 20px;
}

.names {
  font-size: 32px;
  font-weight: bold;
}

.subtitle {
  font-size: 19px;
  margin-top: 15px;
}

.confetti {
  position: absolute;
  top: -20px;
  width: 10px;
  height: 15px;
  animation: fall 3s linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(720deg);
  }
}
</style>
</head>

<body>

<div class="envelope" id="envelope" onclick="openLetter()">
  <span>Aybüke</span>
  <div class="heart h1">♥</div>
  <div class="heart h2">♥</div>
</div>

<div class="message" id="message">
  <div class="date">2026:10:29</div>
  <div class="names">arda ⭐ ❤️ aybüke</div>
  <div class="subtitle">♥ Her şey çok güzel olsun ♥</div>
</div>

<script>
function openLetter() {
  document.getElementById("envelope")
    .classList.add("open");

  document.getElementById("message")
    .classList.add("show");

  for(let i = 0; i < 120; i++) {
    let c = document.createElement("div");
    c.className = "confetti";

    c.style.left = Math.random() * 100 + "vw";
    c.style.backgroundColor =
      ["#ff4f91","#fff","#ffd166","#ff9ebd"][
        Math.floor(Math.random()*4)
      ];

    c.style.animationDelay = Math.random()*1.5 + "s";
    document.body.appendChild(c);

    setTimeout(() => c.remove(), 5000);
  }
}
</script>

</body>
</html>
